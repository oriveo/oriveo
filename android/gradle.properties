# Project-wide Gradle settings. Settings configured in your IDE override this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# The Kotlin compile daemon exits 30 minutes after its last compilation (default: 2 hours).
# Use kotlin.daemon.options, not kotlin.daemon.jvm.options: the latter is passed to the daemon JVM,
# fails with "Unrecognized option", and Kotlin silently falls back to in-process compilation.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Dkotlin.daemon.options=autoshutdownIdleSeconds=1800
# The Gradle daemon exits after 30 idle minutes (milliseconds; default: 3 hours).
org.gradle.daemon.idletimeout=1800000

kotlin.code.style=official
